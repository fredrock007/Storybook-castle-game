<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>Epic Storybook Castle – Mr Samuels, Grade 10 HL 2025</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=4" />
  </head>
  <body>
    <div id="ui">
      <div id="scoreboard">Score: <span id="score">0</span></div>
      <div id="hint">Tap/click to shoot · Tap characters to talk · Pinch/scroll to zoom · Drag to orbit</div>
    </div>

    <div id="dialog" class="hidden">
      <div class="window">
        <div class="speaker" id="speaker">NPC</div>
        <div class="question" id="question">Question text</div>
        <div class="choices">
          <button id="choiceA" class="choice"></button>
          <button id="choiceB" class="choice"></button>
        </div>
        <div class="feedback" id="feedback"></div>
        <div class="actions">
          <button id="nextBtn" class="next" disabled>Next</button>
          <button id="closeBtn" class="close">Close</button>
        </div>
      </div>
    </div>

    <canvas id="app"></canvas>
    <script type="module" src="questions.js?v=4"></script>
    <script type="module" src="main.js?v=4"></script>
  </body>
</html>
